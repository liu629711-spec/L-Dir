[package]
name = "qdir-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4"
eframe = { version = "0.37", features = ["default"] }
egui = "0.37"
fluent-langneg = "0.14"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
time = { version = "0.3", features = ["formatting", "macros"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_Storage_Xps"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 2

[build-dependencies]
embed-manifest = "1.5.1"
